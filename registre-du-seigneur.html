<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Registre du Seigneur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: war-ledger tool — profile bar, inputs (4 armouries) left, sticky tally right, history (chart + ledger) below. */
:root{
  --bg:#eef1ea; --panel:#f8faf5; --field:#ffffff; --ink:#1c2819; --muted:#5a6954; --line:#cbd5c2;
  --forest:#3c6329; --forest-ink:#ffffff; --bronze:#9a5410; --atk:#b0432c; --def:#2f6a7a;
  --good:#2e7a39; --bad:#b03a2a; --soft:#e2e8db; --c4:#6b4fa0;--c5:#c08a1e;--c6:#8a6b5a;--c7:#4f86c6; --shadow:0 1px 2px rgba(28,40,25,.08),0 6px 20px rgba(28,40,25,.06);
  --f-display:'IM Fell DW Pica SC',Georgia,'Times New Roman',serif;
  --f-body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111811; --panel:#18221a; --field:#0e150f; --ink:#e4eadd; --muted:#9aa892; --line:#2e3c2c;
  --forest:#79ad5a; --forest-ink:#0e150f; --bronze:#e0a058; --atk:#ef8166; --def:#6fb7c8;
  --good:#6cc27a; --bad:#f07a68; --soft:#203021; --c4:#b49ae0;--c5:#e0b452;--c6:#c4a493;--c7:#8fb8ea; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111811; --panel:#18221a; --field:#0e150f; --ink:#e4eadd; --muted:#9aa892; --line:#2e3c2c;
  --forest:#79ad5a; --forest-ink:#0e150f; --bronze:#e0a058; --atk:#ef8166; --def:#6fb7c8;
  --good:#6cc27a; --bad:#f07a68; --soft:#203021; --c4:#b49ae0;--c5:#e0b452;--c6:#c4a493;--c7:#8fb8ea; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.25rem}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.brand small{display:block;color:var(--muted);font-size:.85rem;margin-top:4px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:.8rem;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink)}

.profilebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.profilebar label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.profilebar select{min-width:0;max-width:100%;flex:1 1 180px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.btn{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--forest)}
.btn.primary{background:var(--forest);border-color:var(--forest);color:var(--forest-ink);font-weight:700}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);border-color:var(--bad);color:var(--field)}
.btn.small{padding:3px 9px;font-size:.85rem}
.spacer{flex:1}
.storechip{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.storechip i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.savehint{width:100%;margin:0;padding:8px 10px;border-radius:6px;font-size:.85rem;background:color-mix(in srgb,var(--bronze) 12%,transparent);color:var(--ink)}
.pastnote .onlychk{display:flex;justify-content:flex-start;gap:8px;align-items:center;margin-top:8px;font-size:.85rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
.pastnote .onlychk input{width:auto;margin:0}
.onlybox{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:6px}
.onlybox .f{display:grid;gap:2px}.onlybox label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.onlybox input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field);text-align:right;font-variant-numeric:tabular-nums}
.onlybox .sub{grid-column:1/-1;margin:0}
body.totonly #calc{opacity:.45;pointer-events:none}
tr.onlytot td{font-style:italic}
.ranks{display:grid;gap:4px;margin:2px 0 8px}.rkrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rkrow .f{display:grid;gap:2px}.rkrow label{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rkrow input{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--field);text-align:right;font-variant-numeric:tabular-nums}
.startbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;margin:4px 0 8px}.startbar .f{display:grid;gap:2px}.startbar label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.startbar input[type=text]{width:7em;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field);text-align:right}.startbar .chk{text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
td.rk{font-size:.8rem;color:var(--muted);white-space:nowrap}
#rankbox h3{margin:10px 0 2px}
.pastnote{margin:2px 0 8px;padding:7px 9px;border-radius:6px;font-size:.82rem;line-height:1.4;background:color-mix(in srgb,var(--def) 12%,transparent);color:var(--ink)}
.pastnote .golink{border:0;background:none;padding:0;font:inherit;color:var(--forest);text-decoration:underline;cursor:pointer}
.filebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.filebar .fbtext{flex:1 1 320px;line-height:1.4}
.filebar .fbbtns{display:flex;gap:8px;flex-wrap:wrap}
.filebar .dirty{color:var(--bad);font-weight:600}
.filebar .clean{color:var(--good)}
.storechip.ok i{background:var(--good)} .storechip.warn i{background:var(--bronze)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;padding-top:8px;border-top:1px dashed var(--line)}
.inline input[type=text]{flex:1 1 200px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.inline label.chk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;text-transform:none;letter-spacing:0;color:var(--ink)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.armouries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.armouries{grid-template-columns:minmax(0,1fr)}}
fieldset{margin:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0;min-width:0}
legend{display:contents}
.fs-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft);border-radius:10px 10px 0 0}
.fs-head .sub{font-size:.8rem;color:var(--muted)}
.rows{display:grid;gap:2px;padding:8px 10px 12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(110px,46%);align-items:center;gap:10px;padding:4px 4px}
.row label{font-size:.93rem;min-width:0}
.row input,.row select{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--field);text-align:right;font-variant-numeric:tabular-nums}
.row select{text-align:left}
.row input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--field))}
.row input::placeholder{color:var(--muted);opacity:.6}
.hint{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:-2px;padding-left:2px}
.hint.on{color:var(--good);font-weight:700}
.hint:empty{display:none}
.sg-table tr.full td{background:color-mix(in srgb,var(--good) 13%,transparent)}
.sg-table tr.full td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.pbar.full .top span:first-child{color:var(--good);font-weight:600}.pbar.full .top span:first-child::before{content:'✓ '}
.sg-table td input.capped{border-color:var(--bronze);background:color-mix(in srgb,var(--bronze) 14%,var(--field))}
.modebar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:-2px}
.modebar .seg button{padding:2px 9px;font-size:.78rem}
.modebar .golink{border:0;background:none;padding:0;font:inherit;font-size:.8rem;color:var(--forest);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.modebar .golink:hover{color:var(--bronze)}

.racebar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--field);padding:6px 12px;cursor:pointer;font-size:.92rem}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink);font-weight:700}
.mybonus{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;min-width:0;max-width:100%}
.mybonus .f{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;min-width:0;max-width:100%}
.mybonus select{max-width:100%;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field)}
.racecoef{font-size:.8rem;color:var(--muted)}
.formtools{display:flex;gap:8px;flex-wrap:wrap}
.loaded{font-size:.82rem;color:var(--bronze)}

/* tally */
.tally{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
@media (max-width:900px){.tally{position:static}}
.tally-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.grand{font-size:2.3rem;font-weight:800;line-height:1.05;color:var(--bronze);margin-top:2px;word-break:break-all}
.delta{font-size:.85rem;margin-top:4px;color:var(--muted)}
.delta .up{color:var(--good);font-weight:700}.delta .down{color:var(--bad);font-weight:700}
.pair{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.pair > div{padding:10px 16px}
.pair > div + div{border-left:1px solid var(--line)}
.pair .v{font-size:1.25rem;font-weight:700}
.pair .atk .v{color:var(--atk)} .pair .def .v{color:var(--def)}
.lines{padding:8px 16px 12px;display:grid;gap:4px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.line span:first-child{color:var(--muted)}
.line b{font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.badge{font-size:.75rem;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.badge.on{border-color:var(--good);color:var(--good);font-weight:700}
.save{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:8px;background:var(--soft)}
.save .f{display:grid;gap:3px}
.save label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.save input{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--field);min-width:0;width:100%}
.save .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.toast{font-size:.85rem;color:var(--good);min-height:1.2em}

/* tabs */
.groups{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.groups button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-size:1.02rem}
.hm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 14px}@media (max-width:1000px){.hm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:520px){.hm-grid{grid-template-columns:minmax(0,1fr)}}
.hm-card{text-align:left;font:inherit;color:inherit;cursor:pointer}.hm-card:hover{border-color:var(--forest)}.hm-card .big.up{color:var(--good)}.hm-card .big.down{color:var(--bad)}.hm-link{font-size:.8rem;color:var(--forest);margin-top:2px}
.hm-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px;align-items:start}@media (max-width:760px){.hm-cols{grid-template-columns:minmax(0,1fr)}}
.hm-alert{display:block;width:100%;text-align:left;font:inherit;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--bronze);border-radius:6px;padding:7px 10px;margin:0 0 6px;cursor:pointer;color:var(--ink)}.hm-alert.bad{border-left-color:var(--bad)}
#hm-next .btn{margin-top:8px}
.fbdl{flex-basis:100%;color:var(--muted);font-size:.78rem}
.enfrom{display:block;font-size:.72rem;line-height:1.25;color:var(--muted);min-height:1em}.entable td.units{white-space:nowrap;font-size:.8rem}
.enunits{margin:10px 0 4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:grid;gap:3px}.enunits-list{font-weight:600}
.byline{display:block;margin-top:2px;color:var(--muted)}.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit}
.verrow h4{margin:14px 0 4px}.verrow h4 small{color:var(--muted);font-weight:normal}.verrow ul{margin:0;padding-left:1.2em}.verrow li{margin:3px 0}
.groups button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
details.rules{border:1px dashed var(--line);border-radius:8px;padding:4px 10px}details.rules>summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:4px 0}details.rules[open]>summary{margin-bottom:4px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:-6px}
.wrap>*{min-width:0}
@media (max-width:480px){.tabs button{padding:8px 10px;font-size:.95rem}}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-family:var(--f-display);font-size:1.05rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
/* siege tab */
.siege{display:grid;gap:14px}
.sg-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.sg-sum{grid-template-columns:minmax(0,1fr)}}
.sg-card,.ppanel,.prog-grid>*{min-width:0}.ppanel{grid-template-columns:minmax(0,1fr)}.sg-card .big,.sg-card .mid{overflow-wrap:anywhere}
.sg-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.sg-card .big{font-size:1.7rem;font-weight:800;color:var(--bronze);line-height:1.1}
.sg-card .mid{font-size:1.25rem;font-weight:700}
.sg-card .sub{font-size:.85rem;color:var(--muted)}
.sg-card .warn{color:var(--bad);font-weight:700;font-size:.85rem}
.sg-card .okc{color:var(--good);font-weight:700;font-size:.85rem}
.sg-ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sg-ctrl .f{display:grid;gap:3px}
.sg-ctrl label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sg-ctrl input[type=text]{width:9.5em;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--field);text-align:right;font-variant-numeric:tabular-nums}
.sg-ctrl .chk{display:inline-flex;gap:8px;align-items:center;font-size:.92rem;text-transform:none;letter-spacing:0;color:var(--ink);padding-bottom:6px}
.sg-tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.sg-table{min-width:960px}
.sg-table td input{width:6.5em;padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--field);text-align:right;font-variant-numeric:tabular-nums}
.sg-table td input.force{width:5em}
.sg-table td input.unknown{border-style:dashed;border-color:var(--bronze)}
.sg-table td input.bad{border-color:var(--bad)}
.sg-table tr.zero td{color:var(--muted)}
.sg-table tfoot td{font-weight:700;border-bottom:0}
.sg-table .idle{color:var(--bad);font-size:.8rem;display:block}
.vcell{min-width:150px;width:170px;text-align:left}
.ars-table{min-width:980px}
.ars-table .vcell{min-width:140px;width:150px}
.ars-table .vbar{grid-template-columns:minmax(70px,1fr) 3.4em}
.ars-table td input{width:6.5em}
.ars-table tbody th.grp{text-align:left;background:var(--soft);font-family:var(--f-display);font-weight:400;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--ink);padding:9px 10px}
.ars-table tbody th.grp small{font-family:var(--f-body);font-size:.82rem;color:var(--muted);margin-left:10px}
.ars-table tbody th.grp small.warn{color:var(--bad);font-weight:700}
.wtag{display:inline-block;font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);vertical-align:1px}
.sg-ctrl .f.mirror input{width:8.5em}
.capinfo{flex:1 1 260px;min-width:0;font-size:.85rem;color:var(--muted);padding-bottom:6px;display:grid;gap:2px}
.capinfo b{color:var(--ink);font-variant-numeric:tabular-nums}
.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:8px 12px;border-bottom:1px solid var(--line)}
.tbar .seg button{padding:4px 10px;font-size:.85rem}
th.vhead{text-align:left}
.vbar{display:grid;grid-template-columns:minmax(80px,1fr) 3.6em;gap:8px;align-items:center}
.vbar .track{position:relative;height:12px;background:var(--soft);border-radius:2px;overflow:hidden}
.vbar .fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--bronze) 45%,var(--soft));border-radius:2px}
.vbar.best .fill{background:var(--bronze)}
.vbar .lbl{text-align:right;font-variant-numeric:tabular-nums}
.vbar.best .lbl{font-weight:700;color:var(--bronze)}
.vbar.none .lbl{color:var(--muted)}
.sg-note{font-size:.82rem;color:var(--muted)}
.subseg{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.eq-table{min-width:880px}
.sg-table thead th{white-space:normal;vertical-align:bottom;line-height:1.25}
.sg-ctrl .fixed{margin-left:auto;padding-bottom:6px}
td.unk{color:var(--bronze);font-weight:700}
.eq-table td input.name{width:12em;text-align:left}
.eq-table td input.val{width:4.5em}
.sg-table .rank{display:inline-block;min-width:1.6em;padding:1px 6px;border-radius:999px;background:color-mix(in srgb,var(--bronze) 16%,transparent);color:var(--bronze);font-weight:700;font-size:.8rem;text-align:center;margin-right:6px}
.sg-table .cap{color:var(--muted);font-size:.8rem;display:block}
.addrow{display:flex;justify-content:flex-start;padding:10px 12px;border-top:1px solid var(--line)}
.row input:disabled{opacity:.85;border-style:dashed;color:var(--bronze);font-weight:700}

/* history */
.prog{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.enn-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;align-items:start}
@media (max-width:820px){.enn-grid{grid-template-columns:minmax(0,1fr)}}
.enn-grid:has(#en-import[hidden]){grid-template-columns:minmax(0,1fr)}
.enn-grid:has(#en-import[hidden]) .enlist{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

<script>
// ---------- Engine: faithful port of Kingadri's process() (verified identical on 100k random inputs) ----------
var ROL=(function(){
  var C={PIRANHAS:0.8,KRAKEN:100000,LEVIATHAN:5000000,WEREWOLVES_ATTACK:5000000,WEREWOLVES_DEFENS:1000000,
    MERCO_A:2,MERCO_D:2,CAVA_A:4,CAVA_D:4,SOLDAT:1,HERAUT:500,SORCIER:5,DRAGON:20,DEMON:20,TOUR:100};
  var RACES={1:[1.2,0.9],2:[1.5,0.75],3:[0.7,1.15],4:[1,1]};
  function compute(v){
    var n=function(k){return v[k]||0};
    var cf=RACES[v.race||1],ca=cf[0],cd=cf[1];
    var baseA=C.HERAUT*n('herauts')+0.1*n('loups')+C.SORCIER*n('wizards')+C.DRAGON*n('dragons')+C.DEMON*n('demons')+n('mercoa')*C.MERCO_A+n('cavaa')*C.CAVA_A+C.SOLDAT*n('soldata');
    var baseD=C.HERAUT*n('herauts')+0.5*n('loups')+2*C.SORCIER*n('wizards')+2*C.DRAGON*n('dragons')+2*C.DEMON*n('demons')+n('mercod')*C.MERCO_D+n('cavad')*C.CAVA_D+C.SOLDAT*n('soldatd');
    var amf=ca*baseA,dmf=cd*baseD;
    var amf3=baseA+n('equip_wizardsA'),dmf3=baseD+n('equip_wizardsD');
    var muraille=C.KRAKEN*n('krakens')+C.PIRANHAS*n('piranhas')+n('towers')*C.TOUR+n('precinct');
    var leviathan=n('krakens')>=20&&n('piranhas')>=2000;
    if(leviathan)muraille+=C.LEVIATHAN;
    var muraille2=muraille+0.2*n('siege');
    var amf2=amf+n('equip_wizardsA'),dmf2=dmf+n('equip_wizardsD');
    var werewolves=n('loups')>3050;
    if(werewolves){amf+=ca*C.WEREWOLVES_ATTACK;dmf+=cd*C.WEREWOLVES_DEFENS;amf2+=C.WEREWOLVES_ATTACK;dmf2+=C.WEREWOLVES_DEFENS;amf3+=C.WEREWOLVES_ATTACK;dmf3+=C.WEREWOLVES_DEFENS}
    if(n('colosse')>0){amf2+=n('colosse');amf+=n('colosse');amf3+=n('colosse')}
    var pointsa=amf2+n('attack')+n('siege');
    var pointsd=dmf2+n('defens')+muraille;
    var points=amf3+dmf3+n('attack')+n('defens')+n('siege')+muraille;
    return {amf:Math.floor(amf),dmf:Math.floor(dmf),muraille:Math.floor(muraille),muraille2:Math.floor(muraille2),
      pointsa:Math.floor(pointsa),pointsd:Math.floor(pointsd),points:Math.floor(points),leviathan:leviathan,werewolves:werewolves};
  }
  return {compute:compute,RACES:RACES};
})();

// ---------- Static definitions ----------
var PREC=[[0,'Aucune','None'],[17,'Tentes','Tents'],[64,'Palissade','Palisade'],[256,'Mur en chêne','Oak wall'],[3200,'Mur en pierre renforcé','Reinforced stone wall'],[16000,'Double mur renforcé','Reinforced double wall'],[80000,'Forteresse','Fortress'],[300000,'Forteresse haute','High fortress'],[1000000,'Château fort','Stronghold'],[3000000,'Château fort magique','Magic stronghold'],[6000000,'Citadelle','Citadel'],[10000000,'Citadelle féérique','Fairy citadel']];
// Enclosure prices, same order as PREC (Elfes de Taraya, page Fortifications): each level is bought after the previous one;
// the Citadelle féerique costs no écus itself, it needs the 18 guard towers (5 000 × 2^(n-1), 1 310 715 000 in all).
var PREC_PRICE=[0,10000,30000,90000,270000,810000,2430000,7290000,21870000,65610000,196830000,0];
function precIdx(v){var i=0;PREC.forEach(function(p,j){if(p[0]<=(v||0))i=j});return i}
// Colossus FAA by level: 3 M, 5 M, 7 M, then +1 M per level (Kingadri lists up to level 11 = 15 M; extended with the same rule)
var COL=[[0,'Aucun','None']];for(var cl=1;cl<=50;cl++)COL.push([(cl===1?3:cl===2?5:cl+4)*1e6,'Niveau '+cl,'Level '+cl]);
var RACE=[[1,'Chevalier','Knight'],[2,'Suicidaire','Suicidal'],[3,'Sage','Sage'],[4,'Sorcier','Wizard']];
var GROUPS=[
  {key:'gWall',items:[{id:'precinct',sel:PREC},{id:'towers'},{id:'krakens',hint:'hLevi'},{id:'piranhas'}]},
  {key:'gArsenal',items:[{id:'attack',hint:'hArsTab'},{id:'defens',hint:'hArsTab'},{id:'siege',hint:'hSiegeTab'}]},
  {key:'gMagic',items:[{id:'wizards'},{id:'equip_wizardsA',hint:'hEqTabA'},{id:'equip_wizardsD',hint:'hEqTabD'},{id:'dragons'},{id:'demons'},{id:'colosse',sel:COL}]},
  {key:'gBarracks',items:[{id:'loups',hint:'hWolves'},{id:'herauts'},{id:'espions',hint:'hSpies'},{id:'mercoa'},{id:'mercod'},{id:'cavaa'},{id:'cavad'},{id:'soldata'},{id:'soldatd'}]}
];
// Siege weapons: [id, name, game price in écus, force per unit].
// Forces derived from Les Elfes de Taraya's "rentabilité" = force / (price + 7 000 master) × 1 000;
// check: 33 000 of each = 55 605 000 siege power.
var WEAPONS=[['catapulte','Catapulte',100000,320],['bombarde','Bombarde',112000,310],['mangonneau','Mangonneau',65000,275],['trebuchet','Trébuchet',40000,195],
 ['belier_enflamme','Bélier enflammé',27000,125],['pierrerie','Pierrerie',43000,105],['tonnelon','Tonnelon',32000,75],['beffroi','Beffroi',8750,75],
 ['belier','Bélier',21000,75],['combleur','Combleur douves',8200,40],['char','Char',7750,30],['mantelet','Mantelet',11000,30],['echelle','Echelle',7300,30]];
// Wizard equipment: {id, name, price, value (ATT or DEF per item)}. Attack values measured in the game; defense list starts empty.
var EQUIP_DEFAULT={A:[['capuche','Capuche',540,2],['ceinture','Ceinture',580,3],['bottes','Bottes',600,3],['tabar','Tabar',1300,6],['gants','Gants',300,2],['cape','Cape',1000,4],
 ['sacoche','Sacoche',1800,7],['pantalon','Pantalon',1300,5],['philtre','Philtre merveilleux',1380,9],['pendentif','Pendentif du Black Knight',1750,11],['sceptre','Sceptre magique',1650,10],
 ['poussiere','Poussière de lumière',900,5],['manuscrit','Manuscrit sacré',2700,14],['anneau','Anneau du destin',2500,12],['talisman','Talisman enchanté',1700,7]]
 .map(function(a){return {id:a[0],name:a[1],price:a[2],value:a[3]}}),
 D:[['chaperon','Chaperon',540,2],['cordeliere','Cordelière',580,3],['chausses','Chausses',600,3],['surcot','Surcot',867,4],['gantelets','Gantelets',300,2],['pelerine','Pèlerine',750,3],
 ['besace','Besace',1288,5],['braies','Braies',1041,4],['potion','Potion merveilleuse',1073,7],['collier','Collier du Black Knight',1273,8],['baguette','Baguette magique',1155,7],
 ['poudre','Poudre de lumière',540,3],['grimoire','Grimoire sacré',1930,10],['bague','Bague du destin',1875,9],['amulette','Amulette enchantée',1215,5]]
 .map(function(a){return {id:a[0],name:a[1],price:a[2],value:a[3]}})};
// ---------- Production / consumption ----------
// Checked on players' screens: bonus = 1 + Σ quantity × efficiency of the techniques,
// production per turn = serfs × bonus × 50. Next serf costs 200 × (serfs + 1). Surplus is sold, at most 35 000 écus per turn (game FAQ).
var PROD_TECH=[['irrig',"Canal d'irrigation",3,20140],['baie','Baie à cheptel',5,35000],['rotation','Rotation culturale',3,20400],['charrue','Charrue',2,14500],
  ['fenil','Fenil',1,7300],['brouette','Brouette',1,7400],['engrais','Engrais',1,8000]];
var PROD_K=50,SERF_STEP=200,REV_CAP=35000;
// units that eat the same in attack and in defense share one row
var FOOD_ROWS={soldats:['soldata','soldatd'],mercs:['mercoa','mercod'],cavs:['cavaa','cavad']};
function foodCount(inp,id){var m=FOOD_ROWS[id];return m?m.reduce(function(a,k){return a+(inp[k]||0)},0):(inp[id]||0)}
var FOOD_UNITS=['soldats','mercs','cavs','herauts','espions','masters','wizards','dragons','demons','loups','krakens','piranhas'];
function prodBonus(inp){var b=1,pt=inp.prodTech||{};PROD_TECH.forEach(function(x){b+=(pt[x[0]]||0)*x[2]});return b}
function serfCost(from,to){if(to<=from)return 0;return SERF_STEP*(to*(to+1)/2-from*(from+1)/2)}
// confirmed in game by the player: these values cannot be edited; the others are estimates
var FOOD_FIXED={soldats:70,mercs:90,cavs:110,masters:90,wizards:50,demons:0,loups:40,espions:50,herauts:250,dragons:400};
function foodCoef(id){if(FOOD_FIXED[id]!=null)return FOOD_FIXED[id];var c=(S.settings.food||{})[id];return c==null?null:c}
function consEstimate(inp){var known=0,unknown=[];FOOD_UNITS.forEach(function(id){var n=foodCount(inp,id),c=foodCoef(id);if(!n)return;if(c==null)unknown.push(id);else known+=n*c});return {known:known,unknown:unknown}}
function prodCalc(inp){
  var s=inp.serfs||0,b=prodBonus(inp),P=s*b*PROD_K,est=consEstimate(inp),game=0;

function $(id){return document.getElementById(id)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

var S={lang:'fr',store:null,profiles:[],active:null,snaps:[],inputs:{},race:1,loadedFrom:null,
  series:{points:true,pointsa:true,pointsd:true,amf:false,dmf:false},results:null};
function t(k,vars){var s=(T[S.lang][k]!==undefined?T[S.lang][k]:k);if(vars)for(var x in vars)s=s.split('{'+x+'}').join(vars[x]);return s}
function fmt(n){if(n===null||n===undefined||isNaN(n))return '—';var neg=n<0,s=String(Math.abs(Math.floor(n)));s=s.replace(/\B(?=(\d{3})+(?!\d))/g,S.lang==='fr'?' ':',');return (neg?'−':'')+s}
function signed(n){return (n>0?'+':n<0?'−':'±')+fmt(Math.abs(n))}
function parseNum(s){s=String(s==null?'':s).replace(/[\s  .,']/g,'');if(s==='')return {v:0,ok:true};if(!/^-?\d+$/.test(s))return {v:0,ok:false};return {v:parseInt(s,10),ok:true}}
function fmtDate(iso,withTime){var d=new Date(iso);if(isNaN(d))return iso;var o={year:'numeric',month:'short',day:'numeric'};if(withTime){o.hour='2-digit';o.minute='2-digit'}return d.toLocaleString(S.lang==='fr'?'fr-FR':'en-GB',o)}
function localInputNow(){var d=new Date();d.setSeconds(0,0);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function uid8(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function raceName(r){var x=RACE.filter(function(a){return a[0]===r})[0];return x?(S.lang==='fr'?x[1]:x[2]):''}

function cleanInputs(src){var o=emptyInputs();if(!src)return o;
  NUM_IDS.concat(['precinct','colosse','masters']).forEach(function(k){var v=Number(src[k]);if(isFinite(v))o[k]=Math.trunc(v)});

  o.siegeAuto=!!src.siegeAuto;
  ['equipA','equipD'].forEach(function(k){if(src[k]&&typeof src[k]==='object')for(var id in src[k]){var v=Number(src[k][id]);if(/^[\w-]{1,40}$/.test(id)&&isFinite(v)&&v>0)o[k][id]=Math.trunc(v)}});
  o.equipAAuto=!!src.equipAAuto;o.equipDAuto=!!src.equipDAuto;
  if(src.arsenal&&typeof src.arsenal==='object')for(var aid in src.arsenal){var av=Number(src.arsenal[aid]);if(/^[\w-]{1,40}$/.test(aid)&&isFinite(av)&&av>0)o.arsenal[aid]=Math.trunc(av)}
  o.arsAAuto=!!src.arsAAuto;o.arsDAuto=!!src.arsDAuto;
  ['siege','attack','defens','equip_wizardsA','equip_wizardsD'].forEach(function(k){var v=Number(src['man_'+k]);if(isFinite(v)&&v>0)o['man_'+k]=Math.trunc(v)});var cp=Number(src.arsCap);o.arsCap=isFinite(cp)&&cp>0?Math.trunc(cp):0;

  o.plan=cleanPlan(src.plan);o.kgStart=/^\d{4}-\d{2}-\d{2}$/.test(src.kgStart||'')?src.kgStart:'';o.kgShow=!!src.kgShow;

    dump:function(){return read()},
    getSettings:async function(){return read().settings||null},
    putSettings:async function(st){var d=read();d.settings=st;write(d)},
    listProfiles:async function(){var d=read();return Object.keys(d.profiles).map(function(id){var p=d.profiles[id];return {id:id,name:p.name,race:p.race,inputs:p.inputs,createdAt:p.createdAt,updatedAt:p.updatedAt}})},

    patchProfile:async function(id,patch){var d=read();if(!d.profiles[id])return;for(var k in patch)d.profiles[id][k]=patch[k];write(d)},
    deleteProfile:async function(id){var d=read();delete d.profiles[id];write(d)},
    listSnaps:async function(pid){var d=read();var p=d.profiles[pid];if(!p)return [];return Object.keys(p.snaps||{}).map(function(id){var s=p.snaps[id];return {id:id,at:s.at,note:s.note,race:s.race,inputs:s.inputs,totals:s.totals||null,only:!!s.only,ranks:s.ranks||null}})},

function normSettings(x){var o=JSON.parse(JSON.stringify(SETTINGS_DEFAULT));if(!x)return o;

  if(isFinite(Number(x.masterPrice))&&x.masterPrice!==null)o.masterPrice=Math.max(0,Math.trunc(Number(x.masterPrice)));
  if(isFinite(Number(x.target))&&x.target!==null)o.target=Math.max(0,Math.trunc(Number(x.target)));
  if(isFinite(Number(x.equipTarget))&&x.equipTarget!==null)o.equipTarget=Math.max(0,Math.trunc(Number(x.equipTarget)));
  if(x.equip&&typeof x.equip==='object'){o.equip={A:null,D:null};['A','D'].forEach(function(k){if(Array.isArray(x.equip[k]))o.equip[k]=x.equip[k].filter(function(it){return it&&/^[\w-]{1,40}$/.test(String(it.id))}).slice(0,60)
    .map(function(it){return {id:String(it.id),name:String(it.name||'').slice(0,60),price:Math.max(0,Number(it.price)||0),value:(it.value===null||it.value===''||!isFinite(Number(it.value)))?null:Math.max(0,Number(it.value))}})})}
  if(Array.isArray(x.enemies))o.enemies=normEnemies(x.enemies);
  if(x.gains&&typeof x.gains==='object'){o.gains={};Object.keys(x.gains).forEach(function(pid){if(!/^[\w-]{1,40}$/.test(pid)||!Array.isArray(x.gains[pid]))return;
    o.gains[pid]=x.gains[pid].filter(function(g){return g&&/^\d{4}-\d{2}-\d{2}$/.test(g.at)&&isFinite(Number(g.a))}).slice(-2000).map(function(g){return {id:String(g.id||uid8()).slice(0,20),at:g.at,k:String(g.k||'autre').slice(0,20),a:Math.trunc(Number(g.a)),n:String(g.n||'').slice(0,120)}})})}

function equipCalc(inp,k){

  var wizNeed=Math.max(0,target-wiz); // an item only counts when worn: reaching the target also needs that many wizards

 ['arbalete','Arbalète',40,12,3200,'wfoot','jet'],['arc_acier','Arc en acier',35,12,2500,'wfoot','jet'],['francisque','Francisque',145,111,19050,'wfoot','jet'],

function arsVal(it,k){return k==='A'?it.att:it.def}
// Arsenal capacity (per item type, paid once for all weapons). Cost of one step from k 000 to (k+1) 000:
//   k <= 30: k × 1 000 000 (in game: 8 000 -> 9 000 = 8 M)
//   k >= 30: (k - 27) × 10 000 000 (player notes: 40 000 -> 41 000 = 130 M ... 49 000 -> 50 000 = 220 M, total 1 750 M)
// Both rules give 30 M at 30 000; the steps between 9 000 and 40 000 are not checked yet.
function capTarget(need){return Math.ceil(need/1000)*1000}
function capStepCost(k){return k<=30?k*1e6:(k-27)*1e7}
function capUpgradeCost(cap,need){if(!cap||need<=cap)return 0;var c=0;for(var k=Math.ceil(cap/1000);k<Math.ceil(need/1000);k++)c+=capStepCost(k);return c}
// Profitability as on Les Elfes de Taraya (points per 1 000 écus). A weapon also counts the unit that carries it:
// foot weapon -> a mercenary (2 points, 10 000 écus), rider weapon -> a cavalier (4 points, 15 000 écus),
// the unit's points being multiplied by the race coefficient. Checked against the site: 19/20 weapons identical.
var ARS_CARRIER={wfoot:[2,10000],wcav:[4,15000]};
function arsRenta(it,k){var v=arsVal(it,k),cu=ARS_CARRIER[it.slot];if(!v)return 0;if(!cu)return v*1000/it.price;
  var coef=(ROL.RACES[S.race]||[1,1])[k==='A'?0:1];return (v+coef*cu[0])*1000/(it.price+cu[1])}

  // hérauts carry a foot weapon too, and count in attack and in defense (as in Kingadri's formula)

  D:[['wfoot','arsGFoot',['footD'],'arsUFoot'],['wcav','arsGCav',['cavD'],'arsUCav'],['shield','arsGShield',['footD','cavD'],'arsUAll'],['armor','arsGArmor',['footD','cavD'],'arsUAll'],['helmet','arsGHelmet',['footD','cavD'],'arsUAll']]};
S.arsKind=lsGet('rolc-arskind')==='D'?'D':'A';
function arsCalc(inp,k){

var METEO=[0,0,-30,-40,-60]; // 0 % comes up twice as often as each malus

  if(def.sab>0)a[Math.floor(rnd()*3)]*=1-Math.min(0.7,0.02*def.sab); // siege, ranged or melee; magic can't be hit
  var eS=a[0]*mA,dS=def.wall*mD,part=dS>0?Math.min(1,eS/dS):1;

  var seed=(Date.now()%2147483646)+1,rnd=function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  var res={n:n,wins:0,poles:[0,0,0],part:0,full:0,sa:0,sd:0};
  for(var i=0;i<n;i++){var f=simFight(att,def,rnd);if(f.win)res.wins++;f.poles.forEach(function(x,j){if(x)res.poles[j]++});res.part+=f.part;if(f.part>=1)res.full++;res.sa+=f.sa;res.sd+=f.sd}

function enChart(en){
  var box=$('en-chart'),chips=$('en-chips');chips.innerHTML='';box.innerHTML='';
  var obs=en.obs.slice().sort(function(a,b){return a.at<b.at?-1:1});
  var avail=EN_FIELDS.filter(function(f){return f[0]!=='dmg'&&obs.some(function(o){return o.v[f[0]]!=null})});
  if(!S.enSeries)S.enSeries={siegeA:true,magA:true,magD:true,corpsA:true,jetA:true,wallD:true};
  avail.forEach(function(f){var b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',!!S.enSeries[f[0]]);
    var i=document.createElement('i');i.style.background='var('+EN_COLORS[f[0]]+')';b.append(i,t(f[1]));b.addEventListener('click',function(){S.enSeries[f[0]]=!S.enSeries[f[0]];enChart(en)});chips.appendChild(b)});
  var keys=avail.filter(function(f){return S.enSeries[f[0]]});
  // only the observations that hold at least one of the shown values (otherwise empty columns at the edges)
  obs=obs.filter(function(o){return keys.some(function(f){return o.v[f[0]]!=null})});
  if(obs.length<1||!keys.length){var e=document.createElement('div');e.className='empty';e.textContent=t('enNoChart');box.appendChild(e);return}
  var days={};obs.forEach(function(o){var k=new Date(o.at).toDateString();days[k]=(days[k]||0)+1});
  var n=obs.length,W=Math.max(300,box.clientWidth||600),H=210,m={l:50,r:14,t:10,b:30},vmax=1;
  obs.forEach(function(o){keys.forEach(function(f){if(o.v[f[0]]!=null)vmax=Math.max(vmax,o.v[f[0]])})});
  var st=niceStep(vmax,4),top=Math.ceil(vmax/st)*st;
  var X=function(i){return n===1?(m.l+W-m.r)/2:m.l+i*(W-m.l-m.r)/(n-1)},Y=function(v){return m.t+(1-v/top)*(H-m.t-m.b)};
  var NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width','100%');svg.setAttribute('role','img');
  function el(nm,a){var x=document.createElementNS(NS,nm);for(var k in a)x.setAttribute(k,a[k]);svg.appendChild(x);return x}
  for(var v=0;v<=top+st/2;v+=st){el('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1});var tx=el('text',{x:m.l-5,y:Y(v)+3,'text-anchor':'end'});tx.textContent=shortNum(v)}
  var step=Math.max(1,Math.ceil(n/Math.max(2,Math.floor((W-m.l-m.r)/70))));
  obs.forEach(function(o,i){if(i%step&&i!==n-1)return;if(i!==n-1&&n-1-i<step&&i!==0)return;var tx=el('text',{x:X(i),y:H-m.b+14,'text-anchor':n===1?'middle':i===0?'start':i===n-1?'end':'middle'});var dt=new Date(o.at);tx.textContent=dt.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+(days[dt.toDateString()]>1?' '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')});
  keys.forEach(function(f){var col='var('+EN_COLORS[f[0]]+')',d='',pen=false,last=null;
    obs.forEach(function(o,i){var x=o.v[f[0]];if(x==null)return;d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1);pen=true;last=[X(i),Y(x)];el('circle',{cx:X(i),cy:Y(x),r:3,fill:col})});
    if(d)el('path',{d:d,fill:'none',stroke:col,'stroke-width':2,'stroke-linejoin':'round'})});
  var guide=el('line',{x1:0,x2:0,y1:m.t,y2:H-m.b,stroke:'var(--muted)','stroke-dasharray':'3 3',visibility:'hidden'});
  var hit=el('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});box.appendChild(svg);
  var tip=document.createElement('div');tip.className='tip';tip.hidden=true;box.appendChild(tip);
  function show(ev){var rc=svg.getBoundingClientRect(),sx=(ev.clientX-rc.left)*W/rc.width,bi=0,bd=1e18;for(var i=0;i<n;i++){var dd=Math.abs(X(i)-sx);if(dd<bd){bd=dd;bi=i}}
    var o=obs[bi],gx=X(bi);guide.setAttribute('x1',gx);guide.setAttribute('x2',gx);guide.setAttribute('visibility','visible');tip.innerHTML='';
    var dv=document.createElement('div');dv.className='d';dv.textContent=fmtDate(o.at,true)+' — '+(o.src==='rapport'?t(o.role==='att'?'enSrcAtt':'enSrcDef'):t('enSrcMan'));tip.appendChild(dv);
    keys.forEach(function(f){if(o.v[f[0]]==null)return;var l=document.createElement('div');l.className='l';var a=document.createElement('span');a.textContent=t(f[1]);var b=document.createElement('b');b.className='num';b.style.color='var('+EN_COLORS[f[0]]+')';b.textContent=fmt(o.v[f[0]]);l.append(a,b);tip.appendChild(l)});
    tip.hidden=false;var px=gx*rc.width/W,tw=tip.offsetWidth;tip.style.left=Math.max(0,Math.min(rc.width-tw,px+10>rc.width-tw?px-tw-10:px+10))+'px';tip.style.top='4px'}
  hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);hit.addEventListener('pointerleave',function(){tip.hidden=true;guide.setAttribute('visibility','hidden')});
}

function pxCost(it,own,target){var c=0;for(var n=own+1;n<=target;n++)c+=it[0]==='upgrades'?it[2](n-1):it[2](n);return c}
function pxAffordable(it,own,chest){var n=own,c=0,cap=it[3]||Infinity;while(n<cap){var p=it[0]==='upgrades'?it[2](n):it[2](n+1);if(c+p>chest||!isFinite(p))break;c+=p;n++;if(n-own>1e6)break}return {n:n-own,to:n,cost:c}}

  var w=S.inputs.wizards||0,nx=$('mn-next');if(nx)nx.textContent=t('mnNextEcus',{n:fmt(w+1),p:fmt(4500*(w+1))})}

  var sel=$('px-item');if(!sel.options.length)PX_ITEMS.forEach(function(x){var o=document.createElement('option');o.value=x[0];o.textContent=x[1];sel.appendChild(o)});
  var it=pxItem(),S2=S.px=S.px||{};if(S2.item!==it[0]){S2.item=it[0];S2.own=null;S2.want=null;S2.from=null}
  var up=it[0]==='upgrades',own=S2.own!=null?S2.own:it[4](S.inputs),chest=S2.chest!=null?S2.chest:(S.inputs.coffre||0),want=S2.want!=null?S2.want:(it[3]||own+10);
  var set=function(id,v){var el=$(id);if(document.activeElement!==el)el.value=fmt(v)};set('px-own',up?own*1000:own);set('px-chest',chest);set('px-want',up?want*1000:want);

  $('px-rule').textContent=t('pxRule',{r:it[6]})+(it[3]?' · '+t('pxMax',{n:fmt(up?it[3]*1000:it[3])}):'');
  var a=pxAffordable(it,own,chest),u=t(it[5]);

  var need=want>own?pxCost(it,own,want):0;$('px-need').textContent=fmt(need);$('px-need-sub').textContent=want>own?t('pxNeedSub',{a:fmt(up?own*1000:own),b:fmt(up?want*1000:want),m:fmt(Math.max(0,need-chest))}):t('pxNeedNone');
  var cap=it[3]||Infinity,nx=own<cap?(up?it[2](own):it[2](own+1)):null;$('px-next').textContent=nx==null?'—':fmt(nx);$('px-next-sub').textContent=nx==null?t('pxMaxed'):t(up?'pxNextUp':'pxNextSub',{n:fmt(up?(own+1)*1000:own+1)});
  // table
  var from=S2.from!=null?S2.from:own+1,rows=Math.max(1,Math.min(500,S2.rows||20));var fe=$('px-from');if(document.activeElement!==fe)fe.value=fmt(up?from*1000:from);
  var tb=$('px-table');tb.innerHTML='';var h=document.createElement('thead'),tr=document.createElement('tr');[up?'pxColLvl':'pxColN','pxColP','pxColCum'].forEach(function(k,i){var th=document.createElement('th');th.textContent=t(k);th.className=i?'num':'';tr.appendChild(th)});h.appendChild(tr);tb.appendChild(h);
  var bd=document.createElement('tbody'),cum=from-1>own?pxCost(it,own,from-1):0;
  for(var n=Math.max(1,from);n<Math.max(1,from)+rows&&n<=cap;n++){var pr=up?it[2](n-1):it[2](n);if(n>own)cum+=pr;var row=document.createElement('tr');if(n<=own)row.className='zero';
    [up?fmt((n-1)*1000)+' → '+fmt(n*1000):fmt(n),fmt(pr),n<=own?t('pxOwned'):fmt(cum)].forEach(function(v,i){var td=document.createElement('td');td.textContent=v;td.className=i?'num':'txt';row.appendChild(td)});bd.appendChild(row)}
  tb.appendChild(bd);
}

function findLocalServer(){
  // Opened by double-click: if the background calculator is running, continue there (it saves into the folder).
  return new Promise(function(res){
    if(location.protocol!=='file:')return res(false);
    var done=false,sc=document.createElement('script');
    function fin(v){if(done)return;done=true;sc.remove();res(v)}
    sc.src='http://127.0.0.1:8765/api/hello.js?'+Date.now();
    // only the same tool (same page name): an older version or another program on that port is ignored
    sc.onload=function(){var i=window.__ROLC_SERVER__,me=decodeURIComponent(location.pathname.split('/').pop()||'');fin(!!(i&&typeof i==='object'&&i.page===me))};sc.onerror=function(){fin(false)};
    setTimeout(function(){fin(false)},2500);document.head.appendChild(sc);
  });
}
(async function boot(){
  if(await findLocalServer()){location.replace('http://127.0.0.1:8765/');return}
  var db=null,userId=null;
  try{
    if(window.claude&&window.claude.use){
      var res=await Promise.all([window.claude.use('db'),window.claude.use('user'),window.claude.use('downloads')]);
      db=res[0];downloads=res[2];if(db&&res[1])userId=await res[1].id();
    }
  }catch(e){db=null}
  if(db&&userId){S.store=makeDbStore(db,userId)}
  else if(/^https?:$/.test(location.protocol)){
    try{var r=await fetch('api/data',{cache:'no-store'});if(r.ok){var j=await r.json();
      var hasFile=j&&j.profiles&&Object.keys(j.profiles).length;
      var fromLs=lsLoad();
      if(!hasFile&&fromLs&&fromLs.profiles&&Object.keys(fromLs.profiles).length){S.store=makeFileStore({profiles:fromLs.profiles,settings:fromLs.settings||null});FILE.pending={profiles:fromLs.profiles,settings:fromLs.settings||null};filePush()}
      else S.store=makeFileStore({profiles:(j&&j.profiles)||{},settings:(j&&j.settings)||null});}}catch(e){}
  }
  if(!S.store){S.store=makeLocalStore();LOCALF.loading=true}
  if(S.store.kind==='file'){ping();setInterval(ping,20000)}
  try{S.profiles=await S.store.listProfiles()}catch(e){
    if(S.store.kind==='db'){S.store=makeLocalStore();S.profiles=await S.store.listProfiles()}
  }
  try{if(S.store.getSettings){S.settings=normSettings(await S.store.getSettings());buildSiegeTable();buildEquipTable();buildArsTable();enRender()}}catch(e){}
  if(!S.profiles.length){await createProfile(t('defaultName'),S.inputs,S.race)}
  var want=lsGet('rolc-active');var pick=S.profiles.some(function(p){return p.id===want})?want:S.profiles[0].id;
  renderStore();await selectProfile(pick);
  if(LOCALF.loading){LOCALF.loading=false;LOCALF.dirty=false;renderStore();await localResumeCheck()}
})();
